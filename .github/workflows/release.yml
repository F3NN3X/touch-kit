# Pushing a tag `v<version>` tests the workspace, builds the Windows installer and touchprobe.exe,
# and publishes a GitHub Release whose notes are that version's CHANGELOG.md section.
# The release stays a draft until every asset is uploaded, so a failed build never publishes.
#
# Actions are pinned to commit SHAs (tag in the comment): this job can write to the repo, so a
# moved tag must not change what runs. Dependabot (.github/dependabot.yml) proposes updates.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/panel/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/panel/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install frontend dependencies
        working-directory: apps/panel
        run: pnpm install --frozen-lockfile

      - name: Version matches the tag
        shell: pwsh
        run: ./.github/scripts/check-version.ps1 -Tag $env:TAG

      - name: Lint and test
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Test frontend
        working-directory: apps/panel
        run: |
          pnpm typecheck
          pnpm test

      - name: Create draft release
        id: draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/scripts/release-notes.ps1 -Tag $env:TAG -Out release-notes.md
          # A re-run reuses the draft an earlier attempt created.
          gh release view $env:TAG --json databaseId 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --draft --title "Touch Panel $env:TAG" --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw "creating the release failed" }
          }
          $id = gh release view $env:TAG --json databaseId --jq .databaseId
          if (-not $id) { throw "no release id for $env:TAG" }
          "id=$id" >> $env:GITHUB_OUTPUT

      - name: Build installer
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/panel
          tauriScript: pnpm tauri
          releaseId: ${{ steps.draft.outputs.id }}

      - name: Build and upload touchprobe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release -p touchprobe
          gh release upload $env:TAG target/release/touchprobe.exe --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit $env:TAG --draft=false
