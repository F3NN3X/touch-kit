# Every push to main and every pull request: formatting, lint, tests, and builds of the app and the
# libraries, without packaging or publishing anything (release.yml does that on a tag).
# Actions are pinned to the same SHAs as release.yml; Dependabot updates both.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, lint and test
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Test frontend
        run: |
          pnpm -r typecheck
          pnpm -r test

      - name: Build the app and the libraries
        shell: pwsh
        run: |
          Push-Location apps/panel
          pnpm tauri build --no-bundle
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }
          Pop-Location
          cargo build --release -p touchprobe -p touch-ffi
          if ($LASTEXITCODE -ne 0) { throw "touchprobe / touch-ffi build failed" }
          dotnet build bindings/dotnet/TouchKit.Sample -c Release
          if ($LASTEXITCODE -ne 0) { throw "TouchKit build failed" }
