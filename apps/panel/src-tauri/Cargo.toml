[package]
name = "panel"
version = "1.2.0"
edition = "2021"
description = "Touch panel app driven by raw USB touch input"
license = "MIT"

[lib]
name = "panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
touch-core = { path = "../../../crates/touch-core" }
touch-kit-tauri = { path = "../../../crates/touch-kit-tauri" }
tauri = { version = "2", features = ["tray-icon", "devtools"] }  # devtools: dev mode opens them in release builds too
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
log = "0.4"
serde.workspace = true
serde_json.workspace = true
tracing = { workspace = true, features = ["log"] }
anyhow.workspace = true
