# Pushing a tag `v<version>` tests the workspace, builds the Windows installer and touchprobe.exe,
# and publishes a GitHub Release whose notes are that version's CHANGELOG.md section.
# Everything is built before the release is created, so a failed build never publishes.
#
# Actions are pinned to commit SHAs (tag in the comment): this job can write to the repo, so a
# moved tag must not change what runs. Dependabot (.github/dependabot.yml) proposes updates.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Version matches the tag
        shell: pwsh
        run: ./.github/scripts/check-version.ps1 -Tag $env:TAG

      - name: Lint and test
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Test frontend
        run: |
          pnpm -r typecheck
          pnpm -r test

      - name: Build installer, touchprobe and the libraries
        shell: pwsh
        run: |
          Push-Location apps/panel
          pnpm tauri build
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }
          Pop-Location
          cargo build --release -p touchprobe -p touch-ffi
          if ($LASTEXITCODE -ne 0) { throw "touchprobe / touch-ffi build failed" }
          dotnet build bindings/dotnet/TouchKit -c Release
          if ($LASTEXITCODE -ne 0) { throw "TouchKit build failed" }

      # Only this step holds the token, and it runs after every build has succeeded.
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/scripts/release-notes.ps1 -Tag $env:TAG -Out release-notes.md
          $assets = @((Get-ChildItem target/release/bundle/nsis/*-setup.exe).FullName) + @(
            'target/release/touchprobe.exe',
            'target/release/touch_kit.dll',
            'crates/touch-ffi/include/touch_kit.h',
            'bindings/dotnet/TouchKit/bin/Release/net8.0/TouchKit.dll')
          gh release view $env:TAG --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # A re-run after a failed upload: replace the assets, keep the release.
            gh release upload $env:TAG @assets --clobber
          } else {
            gh release create $env:TAG @assets --title "Touch Panel $env:TAG" --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "publishing the release failed" }
