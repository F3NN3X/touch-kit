[package]
name = "touch-ffi"
version = "1.2.0"
edition = "2021"
description = "C ABI over touch-core (touch_kit.dll / libtouch_kit.so) for non-Rust apps"
license = "MIT"

[lib]
name = "touch_kit"
crate-type = ["cdylib", "rlib"]

[dependencies]
touch-core = { path = "../touch-core" }
serde.workspace = true
serde_json.workspace = true
