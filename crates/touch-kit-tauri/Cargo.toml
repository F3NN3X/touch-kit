[package]
name = "touch-kit-tauri"
version = "1.2.1"
edition = "2021"
description = "Tauri glue for touch-core: a never-focused panel window and a Channel bridge to its webview"
license = "MIT"

[dependencies]
touch-core = { path = "../touch-core" }
tauri = "2"
log = "0.4"
serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
serde_json.workspace = true
